name: Build Binaries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION="${{ github.event_name == 'release' && github.event.release.tag_name || 'dev' }}"
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "dist/outlook${EXT}" .

      - name: Smoke test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          ./dist/outlook --version
          ./dist/outlook --help

      - name: Package
        run: |
          TARGET="${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd dist && zip "../outlook-${TARGET}.zip" outlook.exe)
          else
            tar -czf "outlook-${TARGET}.tar.gz" -C dist outlook
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: outlook-${{ matrix.goos }}-${{ matrix.goarch }}
          path: outlook-${{ matrix.goos }}-${{ matrix.goarch }}.*

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} outlook-${{ matrix.goos }}-${{ matrix.goarch }}.*
