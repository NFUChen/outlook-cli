name: Build Binaries

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-amd64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-15-intel
            target: macos-amd64
          - os: macos-14
            target: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - run: uv python install 3.13

      - run: uv sync

      - name: Build binary with PyInstaller
        run: >
          uv run --with pyinstaller pyinstaller
          --onefile
          --clean
          --name outlook
          scripts/pyinstaller_entry.py

      - name: Smoke test
        run: |
          ./dist/outlook --version
          ./dist/outlook --help

      - name: Package
        run: tar -czf outlook-${{ matrix.target }}.tar.gz -C dist outlook

      - uses: actions/upload-artifact@v4
        with:
          name: outlook-${{ matrix.target }}
          path: outlook-${{ matrix.target }}.tar.gz

      - name: Upload to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} outlook-${{ matrix.target }}.tar.gz
